{{ define "main" }}
<div class="max-w-4xl mx-auto px-4 py-8">
  <h1 class="text-3xl font-bold text-center text-fg mb-8">{{ .Title }}</h1>
  <div class="mb-8 text-center text-fg-muted text-sm"><p>{{ i18n "series_help_text" | default "Multi-part posts, in reading order" }}</p></div>
  <div class="space-y-4">
    {{ range .Data.Terms.ByCount }}
    <a href="{{ .Page.RelPermalink }}" class="block bg-surface rounded-lg shadow-sm hover:shadow-md transition-shadow p-5 no-underline group">
      <div class="flex items-baseline justify-between">
        <span class="text-lg font-medium text-fg group-hover:text-accent transition-colors">{{ .Page.Title }}</span>
        <span class="category-count-badge ml-2 bg-accent-soft text-accent px-2 py-0.5 text-xs rounded-full">{{ .Count }} {{ i18n "articles" | default "articles" }}</span>
      </div>
    </a>
    {{ end }}
  </div>
</div>
{{ end }}
